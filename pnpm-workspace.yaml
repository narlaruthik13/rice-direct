packages:
  - "apps/*"
  - "packages/*"

# unrs-resolver's postinstall only downloads a native binary when the optional
# platform package is missing; the platform package installs normally.
ignoredBuiltDependencies:
  - unrs-resolver

# Prisma downloads its query engine and generates the client in install scripts.
onlyBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
